name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  spk:
    needs: goreleaser
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            goarch: amd64
          - arch: armv8
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Derive version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          SEMVER="${TAG#v}"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          echo "spk_version=${SEMVER}-0001" >> "$GITHUB_OUTPUT"

      - name: Build binary
        run: |
          GOOS=linux GOARCH=${{ matrix.goarch }} go build \
            -ldflags "-s -w -X github.com/jmsnll/cardimportd/internal/version.Version=${{ steps.ver.outputs.semver }}" \
            -o cardimportd-linux-${{ matrix.goarch }} \
            ./cmd/cardimportd

      - name: Build SPK
        run: |
          make _spk \
            ARCH=${{ matrix.arch }} \
            BINARY_SUFFIX=linux-${{ matrix.goarch }} \
            SPK_VERSION=${{ steps.ver.outputs.spk_version }}

      - name: Upload SPK to release
        run: |
          gh release upload "${{ github.ref_name }}" \
            "cardimportd-${{ steps.ver.outputs.spk_version }}-${{ matrix.arch }}.spk"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
