name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        run: make ui

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  spk:
    needs: goreleaser
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { syno_arch: x86_64, goarch: amd64 }
          - { syno_arch: armv8,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Derive version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          SEMVER="${TAG#v}"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          echo "spk_version=${SEMVER}-0001" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        run: make ui

      - name: Build binary
        run: |
          GOOS=linux GOARCH=${{ matrix.goarch }} go build \
            -ldflags "-s -w -X github.com/jmsnll/cardimportd/internal/version.Version=${{ steps.ver.outputs.semver }}" \
            -o cardimportd-linux-${{ matrix.goarch }} \
            ./cmd/cardimportd

      - name: Build SPK
        run: |
          make _spk \
            ARCH=${{ matrix.syno_arch }} \
            BINARY_SUFFIX=linux-${{ matrix.goarch }} \
            SPK_VERSION=${{ steps.ver.outputs.spk_version }}

      - name: Upload SPK to release
        run: |
          gh release upload "${{ github.ref_name }}" \
            "cardimportd-${{ steps.ver.outputs.spk_version }}-${{ matrix.syno_arch }}.spk" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pages:
    needs: spk
    runs-on: ubuntu-latest
    steps:
      - name: Download SPK files
        run: |
          TAG="${GITHUB_REF_NAME}"
          SEMVER="${TAG#v}"
          SPK_VER="${SEMVER}-0001"
          mkdir -p /tmp/pages
          for ARCH in x86_64 armv8; do
            curl -fsSL -o "/tmp/pages/cardimportd-${SPK_VER}-${ARCH}.spk" \
              "https://github.com/jmsnll/cardimportd/releases/download/${TAG}/cardimportd-${SPK_VER}-${ARCH}.spk"
          done

      - uses: actions/checkout@v4

      - name: Generate packages.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          SEMVER="${TAG#v}"
          SPK_VER="${SEMVER}-0001"
          python3 scripts/gen-feed.py \
            "https://jmsnll.github.io/cardimportd" \
            "${SPK_VER}" \
            x86_64 armv8 \
            > /tmp/pages/packages.json

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/pages
          publish_branch: gh-pages
          keep_files: true
          commit_message: "Update packages feed for ${{ github.ref_name }}"
