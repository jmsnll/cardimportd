name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        run: make ui

      - uses: actions/upload-artifact@v4
        with:
          name: webui-static
          path: internal/webui/static/
          if-no-files-found: error

  goreleaser:
    needs: build-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: webui-static
          path: internal/webui/static/

      - name: Restore .gitkeep
        run: git checkout internal/webui/static/.gitkeep

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  spk:
    needs: goreleaser
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { syno_arch: x86_64, goarch: amd64 }
          - { syno_arch: armv8,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: webui-static
          path: internal/webui/static/

      - name: Derive version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          SEMVER="${TAG#v}"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          echo "spk_version=${SEMVER}-0001" >> "$GITHUB_OUTPUT"

      - name: Build binary
        run: |
          mkdir -p build
          GOOS=linux GOARCH=${{ matrix.goarch }} go build \
            -ldflags "-s -w -X github.com/jmsnll/cardimportd/internal/version.Version=${{ steps.ver.outputs.semver }}" \
            -o build/cardimportd-linux-${{ matrix.goarch }} \
            ./cmd/cardimportd

      - name: Build SPK
        run: |
          make _spk \
            ARCH=${{ matrix.syno_arch }} \
            BINARY_SUFFIX=linux-${{ matrix.goarch }} \
            SPK_VERSION=${{ steps.ver.outputs.spk_version }}

      - name: Upload SPK to release
        run: |
          gh release upload "${{ github.ref_name }}" \
            "build/cardimportd-${{ steps.ver.outputs.spk_version }}-${{ matrix.syno_arch }}.spk" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pages:
    needs: spk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download SPK files
        run: |
          TAG="${GITHUB_REF_NAME}"
          SEMVER="${TAG#v}"
          SPK_VER="${SEMVER}-0001"
          mkdir -p /tmp/pages
          gh release download "${TAG}" \
            --pattern "*.spk" \
            --dir /tmp/pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate packages.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          SEMVER="${TAG#v}"
          SPK_VER="${SEMVER}-0001"
          python3 scripts/gen-feed.py \
            "https://jmsnll.github.io/cardimportd" \
            "${SPK_VER}" \
            x86_64 armv8 \
            > /tmp/pages/packages.json

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/pages
          publish_branch: gh-pages
          keep_files: true
          commit_message: "Update packages feed for ${{ github.ref_name }}"
