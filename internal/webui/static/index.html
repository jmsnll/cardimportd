<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Importer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <span class="header-title">Card Importer</span>
    <span class="header-sub" id="header-status">cardimportd</span>
  </header>

  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="cards">Cards</button>
    <button class="tab-btn" data-tab="settings">Settings</button>
    <button class="tab-btn" data-tab="notifications">Notifications</button>
  </nav>

  <main>
    <div id="panel-cards" class="panel active"></div>
    <div id="panel-settings" class="panel"></div>
    <div id="panel-notifications" class="panel"></div>
  </main>

  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
