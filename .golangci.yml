version: "2"

linters:
  default: none
  enable:
    - errcheck       # ignored error returns
    - staticcheck    # static analysis (includes SA*, S*, QF* checks)
    - govet          # go vet checks
    - ineffassign    # assignments whose value is never used
    - misspell       # spelling in comments and strings
    - gosec          # common security issues
    - gocritic       # style and correctness diagnostics

  settings:
    gosec:
      excludes:
        # G204: subprocess launched with variable — intentional for post_import_hook
        - G204
        # G304: file inclusion via variable — all paths come from validated config/CLI args
        - G304
        # G115: integer overflow — all conversions are intentional bounded hardware values
        - G115
        # G301/G302: 0o755 dirs and 0o644 files are standard for an import daemon's data
        - G301
        - G302
        # G118: context.Background in shutdown goroutine is intentional (request ctx is done)
        - G118
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        # hugeParam: fixing requires changing the Notifier interface across all impls
        - hugeParam

  exclusions:
    rules:
      # Test files get a lighter touch
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - gocritic

issues:
  max-same-issues: 0
