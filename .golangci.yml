version: "2"

linters:
  default: none
  enable:
    - errcheck       # ignored error returns
    - staticcheck    # static analysis (includes SA*, S*, QF* checks)
    - govet          # go vet checks
    - ineffassign    # assignments whose value is never used
    - misspell       # spelling in comments and strings
    - gosec          # common security issues
    - gocritic       # style and correctness diagnostics

  settings:
    errcheck:
      exclude-functions:
        # Drain + close on HTTP response bodies — errors are unrecoverable
        - (io.ReadCloser).Close
        - (*os.File).Close
        - io.Copy
        # Writing to an http.ResponseWriter (SSE streams) — errors mean client disconnected
        - fmt.Fprintf
        - fmt.Fprintf[*http.ResponseWriter]
    gosec:
      excludes:
        # G204: subprocess via variable — intentional for post_import_hook
        - G204
        # G304: file path from variable — all paths come from validated config/CLI
        - G304
        # G115: integer overflow — all conversions are bounded hardware values
        - G115
        # G301/G302: 0o755 dirs and 0o644 files are correct for a photo import daemon
        - G301
        - G302
        # G118: context.Background in shutdown goroutine is intentional
        - G118
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        # hugeParam: changing Event/ProgressEvent to pointer receivers is a larger refactor
        - hugeParam

issues:
  max-same-issues: 0
  exclude-rules:
    # Test files get a lighter touch
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - gocritic
